<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài 03 - Rà soát hóa đơn</title><style>body{font:15px Arial;max-width:950px;margin:30px auto;padding:0 16px;color:#15243b}input,textarea,select,button{padding:9px;margin:5px 0;box-sizing:border-box}input,textarea,select{width:100%;border:1px solid #bcc7d5;border-radius:5px}button{background:#175cd3;color:white;border:0;border-radius:5px;cursor:pointer}section{border:1px solid #ddd;padding:18px;margin:18px 0;border-radius:8px}pre{white-space:pre-wrap;background:#f4f6fa;padding:12px}label{display:block;margin-top:8px}</style></head><body><h1>Bài 03 – Rà soát hóa đơn gửi trùng</h1><section><label>Mã chứng từ</label><input id="id" value="E01"><label>Văn bản chứng từ (đã OCR)</label><textarea id="raw" rows="8">vendor: ABC Travel
invoice_number: INV-0042
transaction_date: 2026-10-19
amount_minor: 1250000
currency: VND
receipt_id: R-42</textarea><button onclick="extract()">1. Extract</button></section><section><h3>Thông tin AI (có thể sửa)</h3><textarea id="json" rows="12"></textarea><button onclick="check()">2. Kiểm tra trùng</button><h3>Kết quả / cặp nghi trùng</h3><pre id="result"></pre></section><section><h3>Duyệt chứng từ</h3><label>Quyết định</label><select id="decision"><option value="needs_review">Cần xem lại</option><option value="confirm_suspicion">Xác nhận nghi trùng</option><option value="dismiss_suspicion">Bỏ nghi vấn</option></select><label>Ghi chú</label><input id="note"><button onclick="review()">3. Lưu kết quả duyệt</button><pre id="saved"></pre></section><script>let original=null;async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));return j}async function extract(){try{let j=await post('/expenses/extract',{submission_id:document.getElementById('id').value,text:document.getElementById('raw').value});original=j.extracted;document.getElementById('json').value=JSON.stringify(j.extracted,null,2)}catch(e){alert(e.message)}}async function check(){try{let j=await post('/expenses/check',{extracted:JSON.parse(document.getElementById('json').value)});document.getElementById('result').textContent=JSON.stringify(j,null,2);document.getElementById('decision').value=j.status==='duplicate_candidate'?'confirm_suspicion':'needs_review'}catch(e){alert(e.message)}}async function review(){try{let j=await post('/expenses/review',{original_text:document.getElementById('raw').value,extracted:JSON.parse(document.getElementById('json').value),ai_extracted:original,decision:document.getElementById('decision').value,note:document.getElementById('note').value});document.getElementById('saved').textContent=JSON.stringify(j,null,2)}catch(e){alert(e.message)}}</script></body></html>
