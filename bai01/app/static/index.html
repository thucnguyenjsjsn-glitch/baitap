<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Priority</title><style>
body{font:15px system-ui;background:#f5f7fb;color:#19263b;margin:0}main{max-width:1120px;margin:auto;padding:24px}h1{color:#163c79}.panel{background:white;border:1px solid #e0e6f0;border-radius:12px;padding:20px;margin-bottom:18px}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #c6cfdd;border-radius:7px}textarea{min-height:85px}button{border:0;border-radius:7px;padding:11px 18px;background:#2563eb;color:white;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e0e6f0;padding:9px;text-align:left;vertical-align:top}#notice{white-space:pre-wrap}small{color:#5c6880}@media(max-width:700px){.grid{grid-template-columns:1fr}.overflow{overflow-x:auto}}
</style></head><body><main><h1>Quản lý ưu tiên ticket</h1><p>Trích xuất bằng AI → kiểm tra/sửa → xác nhận → xếp hàng đợi</p>
<section class="panel"><h2>1. Nhập tin nhắn</h2><div class="grid"><div><label>Mã ticket</label><input id="ticket_id" value="T01"></div><div><label>Thời điểm nhận (ISO có múi giờ)</label><input id="received_at" value="2026-10-21T09:00:00+07:00"></div></div><label>Tin nhắn</label><textarea id="message">Tôi bị tính tiền hai lần khi thanh toán.</textarea><button id="extractBtn">Extract</button></section>
<section class="panel"><h2>2. Xem và sửa kết quả AI</h2><div class="grid"><div><label>Intent</label><select id="intent"><option>billing</option><option>technical</option><option>account</option><option>other</option></select></div><div><label>Severity</label><select id="severity"><option>low</option><option>medium</option><option>high</option><option>critical</option></select></div><div><label>Product (có thể trống)</label><input id="product"></div><div><label>Cần người xem lại?</label><input id="review" type="checkbox" style="width:auto"></div></div><label>Summary (tối đa 200 ký tự)</label><textarea id="summary" maxlength="200"></textarea><small id="deadline"></small><p><button id="confirmBtn" disabled>Confirm</button></p><div id="notice" role="status"></div></section>
<section class="panel"><h2>3. Hàng đợi</h2><label>Top K</label><input id="limit" type="number" min="1" max="100" value="10" style="max-width:110px"><button id="refreshBtn">Xem Top K</button><button id="nextBtn">Next</button><p id="nextResult"></p><div class="overflow"><table><thead><tr><th>ID</th><th>Hạn xử lý</th><th>Mức khẩn cấp</th><th>Tóm tắt</th><th>Lý do xếp hạng</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id);let aiOriginal=null;const val=id=>$(id).value;
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail||data));return data}
const post=(path,data)=>api(path,{method:'POST',body:JSON.stringify(data)});
function payload(){return {ticket_id:val('ticket_id').trim(),received_at:val('received_at'),message:val('message')}}
function show(msg){$('notice').textContent=msg}
$('extractBtn').onclick=async()=>{try{const data=await post('/tickets/extract',payload());aiOriginal=data.extracted;for(const id of ['intent','severity'])$(id).value=aiOriginal[id];$('product').value=aiOriginal.product||'';$('summary').value=aiOriginal.summary;$('review').checked=aiOriginal.needs_human_review;$('deadline').textContent='Deadline dự kiến: '+data.deadline_at;$('confirmBtn').disabled=false;show('Đã trích xuất. Hãy kiểm tra trước khi xác nhận.')}catch(e){$('confirmBtn').disabled=true;show('Lỗi: '+e.message)}};
$('confirmBtn').onclick=async()=>{try{if(!aiOriginal)throw Error('Chưa Extract');const extracted={ticket_id:aiOriginal.ticket_id,intent:val('intent'),severity:val('severity'),product:val('product').trim()||null,summary:val('summary'),needs_human_review:$('review').checked};const data=await post('/tickets/confirm',{...payload(),extracted,ai_extracted:aiOriginal});show('Đã lưu '+data.ticket_id+'; deadline: '+data.deadline_at);$('confirmBtn').disabled=true;await refresh()}catch(e){show('Lỗi: '+e.message)}};
function cell(tr,v){const td=document.createElement('td');td.textContent=v??'';tr.appendChild(td)}
async function refresh(){try{const data=await api('/tickets/queue?limit='+encodeURIComponent(val('limit')));$('rows').replaceChildren();for(const item of data){const tr=document.createElement('tr');for(const k of ['ticket_id','deadline_at','severity','summary','reason'])cell(tr,item[k]);$('rows').appendChild(tr)}}catch(e){show('Lỗi: '+e.message)}}
$('refreshBtn').onclick=refresh;$('nextBtn').onclick=async()=>{try{const data=await post('/tickets/next',{});$('nextResult').textContent=data.ticket_id?'Đang xử lý: '+data.ticket_id+' — '+data.reason:data.message;await refresh()}catch(e){show('Lỗi: '+e.message)}};refresh();
</script></body></html>
