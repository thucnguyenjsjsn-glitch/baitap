<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài 02 - Đặt cửa kho</title><style>body{font:16px Arial;max-width:980px;margin:35px auto;padding:15px;background:#f7f9fc}section{background:white;padding:22px;margin:15px 0;border-radius:12px}input,textarea,select,button{padding:10px;margin:5px;width:95%;box-sizing:border-box}button{background:#1b65c9;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;background:#eef2f8;padding:12px}label{display:block;margin-top:8px}</style><h1>Bài 02 – Tìm giờ nhận xe tại kho</h1><p><a href="/docs">Swagger API</a></p><section><label>Request ID<input id="rid" value="R01"></label><label>Email<textarea id="email" rows="4">ACME Logistics muốn giao hàng từ 2026-10-21T09:00:00+07:00, cần 60 phút tại cửa thường standard.</textarea></label><button onclick="extract()">1. Extract</button></section><section><h3>Thông tin AI (có thể sửa)</h3><textarea id="json" rows="12"></textarea><button onclick="suggest()">2. Suggest slot</button><pre id="result"></pre><button onclick="confirmBooking()">3. Confirm booking</button></section><section><h3>Lịch cửa kho</h3><button onclick="schedule()">Xem lịch</button><pre id="calendar"></pre></section><script>let slot=null,ai=null;async function call(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d}async function extract(){try{let d=await call('/requests/extract',{request_id:rid.value,email:email.value});ai=d.extracted;json.value=JSON.stringify(ai,null,2);result.textContent='Đã trích xuất; kiểm tra và sửa thông tin trước khi tìm giờ.'}catch(e){result.textContent=e.message}}async function suggest(){try{let extracted=JSON.parse(json.value);slot=await call('/slots/suggest',{extracted});result.textContent=JSON.stringify(slot,null,2)}catch(e){result.textContent=e.message}}async function confirmBooking(){try{if(!slot||slot.status!=='available')throw Error('Chưa có slot hợp lệ');let d=await call('/bookings/confirm',{email:email.value,extracted:JSON.parse(json.value),ai_extracted:ai,dock_id:slot.dock_id,start_at:slot.start_at,end_at:slot.end_at});result.textContent=JSON.stringify(d,null,2);schedule()}catch(e){result.textContent=e.message}}async function schedule(){try{let r=await fetch('/docks/schedule');calendar.textContent=JSON.stringify(await r.json(),null,2)}catch(e){calendar.textContent=e.message}}</script></html>
